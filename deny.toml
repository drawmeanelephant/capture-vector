# cargo-deny config — dependency discipline for the crate map.
# The architectural firewall (only cv-widgets imports rune; only
# cv-engine spawns processes) is enforced by the CI lint job's manifest
# and source scans plus review, since cargo-deny can't see intra-crate
# module boundaries.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# Path deps (our own crates and the vendored rune tree) read as
# wildcards; warn instead of denying until manifests get versions.
wildcards = "warn"
# The no-async-runtime rule guards our own crates' manifests — enforced
# by the lint job's cargo-metadata scan of workspace manifests, not here.
# Rune pulls tokio through wasm-bindgen-futures/zbus for its a11y and web
# stacks.
deny = [
    # No webview / embedded web shell — Rune or nothing (v1 non-goal).
    { name = "tauri" },
    { name = "wry" },
    { name = "tao" },
    { name = "webview2-com" },
    # The editor must not get a second browser engine.
    { name = "servo" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
# Workspace crates are unpublished; no license required yet.
private = { ignore = true }
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Vendored rune tree supplies patched crates by path, not git.
allow-git = []
