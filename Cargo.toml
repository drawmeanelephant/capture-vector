[workspace]
resolver = "3"
# Vendored rune keeps its own workspace root (its crates use
# `workspace.package` inheritance); excluding it stops it collapsing
# into this one.
exclude = ["vendor/rune"]
members = [
    "crates/cv-app",
    "crates/cv-contracts",
    "crates/cv-core",
    "crates/cv-engine",
    "crates/cv-fixtures",
    "crates/cv-ledger",
    "crates/cv-model",
    "crates/cv-notes",
    "crates/cv-publish",
    "crates/cv-rules",
    "crates/cv-store",
    "crates/cv-ui-editor",
    "crates/cv-widgets",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
thiserror = "2"
# 0.41+ bundles SQLite 3.54.1 (RUSTSEC-2026-0459).
rusqlite = { version = "0.41", features = ["bundled"] }
ropey = "1"

# Platform/process control, secret wiping, and test/golden helpers. Keep
# these here so a bump lands once and scripts/check-version-drift.py can
# compare every member's requirement.
tempfile = "3"
zeroize = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
png = "0.18"
flate2 = "1.1"

# rune is vendored (git deps cannot resolve — see spec/architecture.md §0
# and scripts/fetch-rune.sh). The ONLY crate allowed to depend on these is
# cv-widgets; cargo-deny enforces the firewall.
rune = { path = "vendor/rune/crates/rune", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg"] }
rune-kit = { path = "vendor/rune/crates/rune-kit", default-features = false }
# GPU effect layers for the opt-in signature moments (cv-widgets `effects`
# feature). wgpu is rune's own pin; cv-widgets names it only to drive the
# compositor hook, and rune turns on its backends.
rune-fx = { path = "vendor/rune/crates/rune-fx" }
wgpu = { version = "~30.0.1", default-features = false }
# Scalar CPU reference renderer — test-only (cv-widgets `reference` feature).
rune-ref = { path = "vendor/rune/crates/rune-ref", features = ["gpu"] }

cv-core = { path = "crates/cv-core" }
cv-contracts = { path = "crates/cv-contracts" }
cv-fixtures = { path = "crates/cv-fixtures" }
cv-engine = { path = "crates/cv-engine" }
cv-ledger = { path = "crates/cv-ledger" }
cv-publish = { path = "crates/cv-publish" }
cv-notes = { path = "crates/cv-notes" }
cv-rules = { path = "crates/cv-rules" }
cv-store = { path = "crates/cv-store" }
cv-model = { path = "crates/cv-model" }
cv-widgets = { path = "crates/cv-widgets" }
cv-ui-editor = { path = "crates/cv-ui-editor" }

# A dependency's [patch] does not propagate to dependents — the workspace
# must replicate rune's vendor patches itself (fetch-rune.sh prints this
# same block).
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
sctk-adwaita = { path = "vendor/rune/vendor/sctk-adwaita" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/rune/vendor/accesskit_macos" }

# rune-ref's scalar oracle is ~30x slower unoptimized; its strict-f32 + soft-libm
# design keeps bytes identical across opt levels (vendor research/24).
[profile.dev.package.rune-ref]
opt-level = 3
