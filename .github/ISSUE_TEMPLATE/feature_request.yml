name: Feature request
description: Propose a change to authoring, auditing, or publishing.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves it. Note the crate/lane.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI shell
        - Editor
        - Engine (Boris)
        - Rules and audit
        - Publish and signing
        - Research and notes
        - Build and packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they are worse.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This respects the non-goals in `spec/vision.md` (no webview, no in-app HTML renderer, Boris semantics are not reimplemented).
          required: true
        - label: Windows/Linux impact is called out if this is OS-specific.
          required: true
