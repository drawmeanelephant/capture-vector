name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Vendored rune is gitignored on purpose; fetch at the pinned rev.
      - name: fetch rune
        shell: bash
        run: ./scripts/fetch-rune.sh

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: wgpu/vulkan deps (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libxkbcommon-dev

      # Gate: no boris, no display, no net needed at test time.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # PNG goldens: canonical rasterizer only (Linux + Lavapipe). The
      # cross-OS UI gate is the tree/layout JSON in `cv-app --test goldens`.
      - name: PNG goldens (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ls /usr/share/vulkan/icd.d/
          bash scripts/check-ui-png.sh

      # A mismatch keeps the Lavapipe renders, so a deliberate visual change
      # is blessed from the canonical rasterizer, never a local GPU.
      # Same idea as the PNG renders: scene_goldens writes *.actual.json
      # next to the goldens, so a failed run hands back the canonical
      # render for blessing instead of needing a second machine.
      - name: upload golden actuals
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-actuals-${{ matrix.os }}
          path: fixtures/ui/golden/tree/*.actual.json
          if-no-files-found: ignore
          retention-days: 7

      - name: upload PNG renders
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ui-png-lavapipe
          path: target/ui/*.png
          if-no-files-found: ignore
          retention-days: 7

      # The opt-in `effects` compositor draws real GPU frames, so it runs
      # where Lavapipe is installed.
      - name: cargo test -p cv-widgets --features effects (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p cv-widgets --features effects --locked

  lint:
    name: fmt + clippy + firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fetch rune
        shell: bash
        run: ./scripts/fetch-rune.sh
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --package cv-core --package cv-contracts --package cv-fixtures --package cv-engine --package cv-store --package cv-rules --package cv-ledger --package cv-publish --package cv-notes --package cv-model --package cv-widgets --package cv-ui-editor --package cv-app --package xtask -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings -D clippy::cognitive_complexity
      - name: clippy (effects)
        run: cargo clippy -p cv-app -p cv-widgets --all-targets --no-deps --features effects -- -D warnings -D clippy::cognitive_complexity
      - name: unused dependencies
        run: ./scripts/check-unused-deps.sh
      - name: repo hygiene
        run: ./scripts/check-hygiene.sh
      - name: rune firewall — only cv-widgets imports rune
        run: |
          offenders=$(grep -rln --include='Cargo.toml' -E '^(rune|rune-kit) *\=' crates | grep -v 'crates/cv-widgets/' || true)
          if [ -n "$offenders" ]; then
            echo "rune imported outside cv-widgets:"; echo "$offenders"; exit 1
          fi
      - name: no async runtime in our crates' manifests
        run: |
          offenders=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | .name as $n | .dependencies[]
                     | select(.name == "tokio" or .name == "async-std")
                     | "\($n) -> \(.name)"')
          if [ -n "$offenders" ]; then
            echo "async runtime declared by a workspace crate:"; echo "$offenders"; exit 1
          fi
      - name: no std::process outside cv-engine
        run: |
          offenders=$(grep -rln --include='*.rs' 'Command::new\|process::exit\|Command::spawn' crates | grep -v 'crates/cv-engine/' || true)
          if [ -n "$offenders" ]; then
            echo "process spawn outside cv-engine:"; echo "$offenders"; exit 1
          fi
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
