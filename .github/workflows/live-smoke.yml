name: live-smoke

# Opt-in smoke against a REAL pinned boris (#28). Never a required check:
# it builds boris from an external repo, so it runs weekly, on manual
# dispatch, and on PRs that edit this workflow — never on ordinary PRs.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/live-smoke.yml

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match cv-engine's `locate::PINNED` (boris/0.9.0, vcs 66efcfb).
  BORIS_REPO: drawmeanelephant/boris
  BORIS_REF: v0.9.0
  BORIS_VCS: 66efcfb

jobs:
  build-boris:
    name: build boris
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A real git checkout so build.zig auto-detects the vcsRevision the
      # cv-engine gate checks; a tarball would bake an empty one.
      - name: clone boris
        run: git clone --depth 1 --branch "$BORIS_REF" "https://github.com/$BORIS_REPO.git" boris

      - name: zig 0.17.0
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0
          use-cache: false

      # Zig defaults to -Dcpu=native; the smoke job may land on a runner
      # with an older CPU (SIGILL), so target the baseline x86_64.
      - name: zig build --release=safe -Dcpu=baseline
        working-directory: boris
        run: zig build --release=safe -Dcpu=baseline

      - name: check identity
        working-directory: boris
        run: |
          ./zig-out/bin/boris --version
          ./zig-out/bin/boris --build-info
          ./zig-out/bin/boris --version | grep -qx "boris/${BORIS_REF#v}"
          ./zig-out/bin/boris --build-info | grep -q "\"vcsRevision\": \"$BORIS_VCS\""

      - uses: actions/upload-artifact@v4
        with:
          name: boris-linux-x86_64
          path: boris/zig-out/bin/boris
          if-no-files-found: error
          retention-days: 7

  live-smoke:
    name: cv-engine live_pinned_boris
    needs: build-boris
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: fetch rune
        shell: bash
        run: ./scripts/fetch-rune.sh

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: boris-linux-x86_64
          path: ${{ runner.temp }}/boris-bin

      # upload-artifact drops the executable bit.
      - name: set CV_BORIS_BIN
        run: |
          bin="$RUNNER_TEMP/boris-bin/boris"
          chmod +x "$bin"
          "$bin" --version
          echo "CV_BORIS_BIN=$bin" >> "$GITHUB_ENV"

      - name: cargo test -p cv-engine --test live_smoke -- --ignored
        run: cargo test -p cv-engine --locked --test live_smoke -- --ignored --nocapture
