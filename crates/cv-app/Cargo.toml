[package]
name = "cv-app"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Composition root + rune shell wiring. Integrator-owned."

[dependencies]
cv-core.workspace = true
cv-engine.workspace = true
cv-ledger.workspace = true
cv-model.workspace = true
cv-notes.workspace = true
# default-features=false keeps the mock secret backend out of the shipped binary.
cv-publish = { workspace = true, default-features = false }
cv-store.workspace = true
# default-features=false keeps the QA harness out of the shipped binary.
cv-widgets = { workspace = true, default-features = false }
cv-ui-editor.workspace = true
# Wave-0 canary: StubEngine replays captured Boris watch sessions until
# cv-engine's real adapter is wired by the integrator.
cv-fixtures.workspace = true
serde_json.workspace = true

[features]
# GPU layers for the opt-in signature effects (issue #57). Off by default.
effects = ["cv-widgets/effects"]

[dev-dependencies]
cv-widgets = { workspace = true, features = ["reference", "harness"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
