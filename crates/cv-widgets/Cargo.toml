[package]
name = "cv-widgets"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "The ONLY crate importing rune/rune-kit (version firewall; cargo-deny enforces)."

[dependencies]
# Native Open-folder dialog for the workspace picker (rfd on macOS and
# Windows, the XDG portal on Linux).
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit = { workspace = true, features = ["markdown"] }
cv-core.workspace = true
cv-model.workspace = true
cv-ui-editor.workspace = true
serde.workspace = true
serde_json.workspace = true
# Test-only: replay the headless frame on rune-ref's CPU oracle (issue #26
# probe). Never enabled in the shipped app.
rune-ref = { workspace = true, optional = true }
png = { workspace = true, optional = true }
# Opt-in signature effects (issue #57): the compositor that draws rune-fx
# layers at the shell's effect slots. Off by default; the slots themselves
# are emitted only when Theme::effects_on().
rune-fx = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[features]
# `harness` is on for cv-widgets' own tests; dependents ship without it.
default = ["harness"]
harness = []
reference = ["dep:rune-ref", "dep:png"]
effects = ["dep:rune-fx", "dep:wgpu"]

[build-dependencies]
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
cv-fixtures.workspace = true
flate2.workspace = true
sha2.workspace = true
tempfile.workspace = true
